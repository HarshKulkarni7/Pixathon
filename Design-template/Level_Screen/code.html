  <style>
    :root {
      --color-bg: #050609;
      --color-midnight: #101B2B;
      --color-cyan: #48D9E8;
      --color-gold: #FFD166;
      --color-red: #FF3434;
      --color-ivory: #F4F0E8;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-ivory);
      font-family: 'Silkscreen', monospace;
      user-select: none;
      overflow-x: hidden;
    }

    .font-pixel-heading {
      font-family: 'Press Start 2P', monospace;
    }

    .font-retro-sub {
      font-family: 'VT323', monospace;
    }

    /* CRT scanline & vignette overlay */
    .crt-overlay::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 40;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      opacity: 0.85;
    }

    .vignette {
      background: radial-gradient(circle at center, transparent 45%, rgba(3, 4, 7, 0.85) 90%, rgba(2, 2, 4, 0.98) 100%);
    }

    /* Pixel border utilities */
    .pixel-box-cyan {
      border: 3px solid var(--color-cyan);
      box-shadow: 0 0 16px rgba(72, 217, 232, 0.35), inset 0 0 10px rgba(72, 217, 232, 0.15);
    }

    .pixel-box-muted {
      border: 2px solid #233144;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
    }

    .pixel-box-red {
      border: 2px solid rgba(255, 52, 52, 0.45);
      box-shadow: 0 0 12px rgba(255, 52, 52, 0.15), inset 0 0 15px rgba(0,0,0,0.7);
    }

    /* Custom hover transforms */
    .level-card {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .level-card:hover {
      transform: translateY(-4px);
    }

    .unlocked-card:hover {
      box-shadow: 0 0 24px rgba(72, 217, 232, 0.55), 0 8px 30px rgba(0, 0, 0, 0.8);
      border-color: #6cf7ff;
    }

    .pixel-btn-cyan {
      background: #48D9E8;
      color: #050609;
      box-shadow: 4px 4px 0px #136973;
      transition: all 0.15s ease;
    }
    .pixel-btn-cyan:hover {
      background: #6df9ff;
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0px #136973;
    }
    .pixel-btn-cyan:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #136973;
    }

    .pixel-btn-ghost {
      border: 2px solid #2f3e52;
      background: rgba(16, 27, 43, 0.7);
      color: #8da4be;
      transition: all 0.15s ease;
    }
    .pixel-btn-ghost:hover {
      border-color: var(--color-cyan);
      color: var(--color-cyan);
      background: rgba(16, 27, 43, 0.95);
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 12px rgba(72, 217, 232, 0.4), inset 0 0 8px rgba(72, 217, 232, 0.2);
      }
      50% {
        box-shadow: 0 0 22px rgba(72, 217, 232, 0.7), inset 0 0 14px rgba(72, 217, 232, 0.35);
      }
    }
    .pulse-glow {
      animation: pulseGlow 2.8s infinite ease-in-out;
    }

    @keyframes flickerRed {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.4; }
    }
    .flicker-danger {
      animation: flickerRed 3s infinite ease-in-out;
    }
  </style>

  <!-- Retro Sound Synthesizer Script -->
  <script>
    let audioCtx = null;
    let bgmActive = true;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function playBeep(freq, type, duration, vol=0.08) {
      try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch(e) {}
    }

    function playClickSound() {
      playBeep(320, 'square', 0.08, 0.06);
      setTimeout(() => playBeep(240, 'square', 0.1, 0.05), 40);
    }

    function playLaunchSound() {
      playBeep(440, 'triangle', 0.1, 0.1);
      setTimeout(() => playBeep(660, 'square', 0.12, 0.1), 80);
      setTimeout(() => playBeep(880, 'square', 0.25, 0.12), 160);
    }

    function toggleAudio() {
      bgmActive = !bgmActive;
      const btn = document.getElementById('bgm-toggle');
      if (bgmActive) {
        btn.innerHTML = '<span class="text-[#48D9E8]">🔊</span> BGM: ON';
        playClickSound();
      } else {
        btn.innerHTML = '<span class="text-gray-500">🔇</span> BGM: OFF';
      }
    }

    // Attach hover sound to interactive level cards and buttons
    document.querySelectorAll('.unlocked-card, .pixel-btn-cyan, .pixel-btn-ghost').forEach(el => {
      el.addEventListener('mouseenter', () => {
        playBeep(520, 'sine', 0.04, 0.03);
      });
    });
  </script>
